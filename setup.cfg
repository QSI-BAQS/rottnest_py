[metadata]
name = rottnest 
description = "Rottnest Python Backend"
long_description = file: README.md
long_description_content_type = text/markdown; charset=UTF-8
url = https://github.com/alan-robertson/rottnest_py


[options]
zip_safe = False
include_package_data = True
package_dir =
    = src
packages = find_namespace:
python_requires = ~=3.8

install_requires =
    bottle
    gevent
    gevent-websocket
    cabaliser
    pycryptodome
    ipython==8.30
    matplotlib==3.10.8
    qualtran==0.4
    pyLIQTR==1.3.3
    openfermion==1.6.1
    pyscf==2.7.0
    matplotlib_inline==0.1.7



[options.packages.find]
where = src

[options.extras_require]
dev =
    pytest~=6.2
